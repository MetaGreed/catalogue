 <!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fiche Produit - Catalogue Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen" x-data="productPage()" x-init="init()">

  <header class="border-b border-zinc-800 bg-zinc-900/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-9 h-9 bg-emerald-600 rounded-lg flex items-center justify-center font-bold">C</div>
        <span class="font-bold">Catalogue Pro</span>
      </a>
      <a href="index.html" class="text-sm text-zinc-400 hover:text-white">← Retour</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-10" x-show="product">
    <div class="grid md:grid-cols-2 gap-10">
      <div class="bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800">
        <img :src="product?.image" :alt="product?.name" class="w-full aspect-square object-cover">
      </div>

      <div>
        <p class="text-emerald-500 text-sm mb-2" x-text="product?.category"></p>
        <h1 class="text-2xl md:text-3xl font-bold mb-3" x-text="product?.name"></h1>
        <p class="text-zinc-400 mb-6" x-text="product?.description"></p>
        
        <div class="mb-6">
          <p class="text-sm text-zinc-500 mb-1">Référence</p>
          <p class="font-mono text-emerald-400" x-text="product?.sku"></p>
        </div>

        <div class="text-3xl font-bold text-emerald-400 mb-8" x-text="formatPrice(product?.price)"></div>

        <button @click="orderWhatsApp()" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 rounded-xl font-medium text-lg transition">
          Commander via WhatsApp
        </button>
      </div>
    </div>
  </main>

  <div x-show="!product" class="text-center py-20 text-zinc-500">
    Produit non trouvé. <a href="index.html" class="text-emerald-500 underline">Retour au catalogue</a>
  </div>

  <script>
    function productPage() {
      const products = [
        {id:1, name:"Souris sans fil Logitech M185", sku:"LOG-M185-BK", price:8500, category:"Électronique", description:"Souris sans fil fiable, autonomie longue durée.", image:"https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=500"},
        {id:2, name:"Clavier mécanique RGB Redragon", sku:"RDG-K552", price:28500, category:"Électronique", description:"Clavier mécanique rétroéclairé RGB.", image:"https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500"},
        {id:3, name:"Écouteurs Bluetooth JBL Tune 510BT", sku:"JBL-510BT", price:19500, category:"Électronique", description:"Écouteurs supra-auriculaires, son JBL Pure Bass.", image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"},
        {id:4, name:"Chaise de bureau ergonomique", sku:"CHR-ERG-01", price:45000, category:"Meubles", description:"Chaise confortable avec support lombaire.", image:"https://images.unsplash.com/photo-1580480055273-228ff5388ef8?w=500"},
        {id:5, name:"Bureau compact en bois", sku:"BRU-WOOD-90", price:38500, category:"Meubles", description:"Bureau moderne 90x50 cm.", image:"https://images.unsplash.com/photo-1518455027359-f3f8164ba55c?w=500"},
        {id:6, name:"Lampe de bureau LED", sku:"LMP-LED-01", price:12500, category:"Meubles", description:"Lampe LED ajustable, 3 modes.", image:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=500"},
        {id:7, name:"Mixeur plongeant 3 en 1", sku:"MIX-3IN1", price:16500, category:"Cuisine", description:"Mixeur plongeant puissant.", image:"https://images.unsplash.com/photo-1585515320310-259814833e7e?w=500"},
 {id:8, name:"Casserole antiadhésive 24cm", sku:"CAS-24", price:9800, category:"Cuisine", description:"Casserole antiadhésive compatible induction.", image:"https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=500"},
        {id:9, name:"Bouilloire électrique inox", sku:"BQL-INOX", price:11200, category:"Cuisine", description:"Bouilloire 1.7L en inox.", image:"https://images.unsplash.com/photo-1570222094114-d054a817e56b?w=500"},
        {id:10, name:"T-shirt coton premium", sku:"TSH-COT-01", price:7500, category:"Vêtements", description:"T-shirt 100% coton, coupe moderne.", image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"},
        {id:11, name:"Jean slim stretch", sku:"JEA-SLIM", price:18500, category:"Vêtements", description:"Jean slim confortable.", image:"https://images.unsplash.com/photo-1542272454315-7f6b6b8c0b0b?w=500"},
        {id:12, name:"Sneakers casual blanches", sku:"SNK-WHT", price:24500, category:"Vêtements", description:"Sneakers blanches polyvalentes.", image:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500"}
      ];

      return {
        product: null,
        whatsappNumber: '237651297036',

        init() {
          const params = new URLSearchParams(window.location.search);
          const id = parseInt(params.get('id'));
          this.product = products.find(p => p.id === id) || null;
        },

        formatPrice(price) {
          if (!price) return '';
          return new Intl.NumberFormat('fr-FR').format(price) + ' FCFA';
        },

        orderWhatsApp() {
          if (!this.product) return;
          const message = `Bonjour, je suis intéressé par :\n\n• ${this.product.name}\n• Référence : ${this.product.sku}\n• Prix : ${this.formatPrice(this.product.price)}\n\nPouvez-vous me confirmer la disponibilité ?`;
          const url = `https://wa.me/${this.whatsappNumber}?text=${encodeURIComponent(message)}`;
          window.open(url, '_blank', 'noopener,noreferrer');
        }
      }
    }
  </script>
</body>
</html>
